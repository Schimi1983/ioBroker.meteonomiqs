name: Test and Release

# Uses the official ioBroker testing actions. The repository checker expects
# these (W3013 / W3015 / W3017) and they bring the whole matrix along.

on:
  push:
    branches:
      - '*'
    tags:
      # normal versions
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # pre-releases
      - 'v[0-9]+.[0-9]+.[0-9]+-**'
  pull_request: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type check, lint and validate package files
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v1
        with:
          node-version: '22.x'
          lint: true

  # Unit and integration tests on all supported platforms.
  # The matrix must not go below package.json "engines.node" (>=22).
  adapter-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    needs: [check-and-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      # Show every failing combination instead of cancelling the rest.
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          build: true

  # Publish to npm on a version tag
  deploy:
    needs: [adapter-tests]
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '24.x'
          build: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
